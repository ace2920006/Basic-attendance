<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="4" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="230" r="160" fill="url(#glowGrad)" />

  <!-- Graduation Cap (Academic Core) -->
  <g filter="url(#shadow)">
    <!-- Cap Diamond -->
    <path d="M256 120 L420 190 L256 260 L92 190 Z" fill="url(#primaryGrad)" />
    <!-- Cap Bottom Base -->
    <path d="M140 220 L140 290 C140 330 200 360 256 360 C312 360 372 330 372 290 L372 220 L256 270 Z" fill="#312e81" opacity="0.9" />
    <!-- Cap Rim Highlight -->
    <path d="M256 120 L420 190 L256 200 L92 190 Z" fill="#818cf8" opacity="0.4" />
    <!-- Tassel -->
    <path d="M375 195 L405 240 L395 320" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="395" cy="328" r="10" fill="#38bdf8" />
  </g>

  <!-- Live Attendance Shield Check Badge -->
  <g transform="translate(290, 270)" filter="url(#shadow)">
    <!-- Badge Background -->
    <circle cx="80" cy="80" r="72" fill="#0f172a" stroke="#10b981" stroke-width="6" />
    <circle cx="80" cy="80" r="60" fill="url(#accentGrad)" />
    <!-- Checkmark -->
    <path d="M55 80 L72 97 L108 61" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Subtle App Label Accent -->
  <text x="256" y="440" font-family="'Outfit', -apple-system, sans-serif" font-size="34" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="4">CAMPUS ATTEND</text>
</svg>
